<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1913" />
      <stop offset="100%" stop-color="#14120B" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5A00" />
      <stop offset="100%" stop-color="#FF7A33" />
    </linearGradient>
  </defs>

  <!-- Background card -->
  <rect x="2" y="2" width="956" height="416" fill="url(#bgGrad)" stroke="#302E27" stroke-width="2"/>

  <!-- Header banner -->
  <rect x="36" y="32" width="8" height="28" fill="url(#accentGrad)" />
  <text x="56" y="52" fill="#F5F3EB" font-family="'Uncut Sans', system-ui, sans-serif" font-size="20" font-weight="600" letter-spacing="-0.02em">Astro Build &amp; Distribution Architecture</text>
  <text x="56" y="74" fill="#A9A69D" font-family="'JetBrains Mono', monospace" font-size="12">STATIC CONTENT PIPELINE · HIGH AVAILABILITY · ZERO CLIENT RUNTIME</text>

  <!-- Node 1: Content Collection -->
  <g transform="translate(48, 120)">
    <rect width="240" height="230" fill="#24211A" stroke="#3D392E" stroke-width="1.5" />
    <rect x="20" y="20" width="40" height="40" fill="#1B1913" stroke="#FF5A00" stroke-width="1.5" />
    <text x="40" y="46" text-anchor="middle" fill="#FF5A00" font-family="system-ui" font-size="20" font-weight="bold">📄</text>
    <text x="74" y="38" fill="#F5F3EB" font-family="'Uncut Sans', system-ui" font-size="16" font-weight="600">Markdown Files</text>
    <text x="74" y="54" fill="#A9A69D" font-family="'JetBrains Mono', monospace" font-size="11">src/content/writings/</text>
    
    <line x1="20" y1="76" x2="220" y2="76" stroke="#302E27" stroke-width="1" />
    
    <rect x="20" y="90" width="200" height="34" fill="#1B1913" stroke="#302E27" />
    <text x="32" y="112" fill="#F5F3EB" font-family="'JetBrains Mono', monospace" font-size="12">Zod Schema Validation</text>
    
    <rect x="20" y="132" width="200" height="34" fill="#1B1913" stroke="#302E27" />
    <text x="32" y="154" fill="#F5F3EB" font-family="'JetBrains Mono', monospace" font-size="12">LaTeX (KaTeX)</text>
    
    <rect x="20" y="174" width="200" height="34" fill="#1B1913" stroke="#302E27" />
    <text x="32" y="196" fill="#F5F3EB" font-family="'JetBrains Mono', monospace" font-size="12">Shiki Syntax Highlight</text>
  </g>

  <!-- Connection arrow 1 -> 2 -->
  <path d="M 296 235 L 350 235" stroke="#FF5A00" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="356,235 346,230 346,240" fill="#FF5A00" />

  <!-- Node 2: Astro Compiler Core -->
  <g transform="translate(364, 120)">
    <rect width="240" height="230" fill="#24211A" stroke="#FF5A00" stroke-width="2" />
    <rect x="20" y="20" width="40" height="40" fill="#1B1913" stroke="#FF5A00" stroke-width="1.5" />
    <text x="40" y="46" text-anchor="middle" fill="#FF5A00" font-family="system-ui" font-size="20">⚡</text>
    <text x="74" y="38" fill="#F5F3EB" font-family="'Uncut Sans', system-ui" font-size="16" font-weight="600">Astro 5 Compiler</text>
    <text x="74" y="54" fill="#A9A69D" font-family="'JetBrains Mono', monospace" font-size="11">Vite + Islands Engine</text>
    
    <line x1="20" y1="76" x2="220" y2="76" stroke="#302E27" stroke-width="1" />
    
    <rect x="20" y="90" width="200" height="34" fill="#1B1913" stroke="#302E27" />
    <text x="32" y="112" fill="#F5F3EB" font-family="'JetBrains Mono', monospace" font-size="12">Static Route Generation</text>
    
    <rect x="20" y="132" width="200" height="34" fill="#1B1913" stroke="#302E27" />
    <text x="32" y="154" fill="#F5F3EB" font-family="'JetBrains Mono', monospace" font-size="12">Tailwind v4 CSS Purge</text>
    
    <rect x="20" y="174" width="200" height="34" fill="#1B1913" stroke="#302E27" />
    <text x="32" y="196" fill="#F5F3EB" font-family="'JetBrains Mono', monospace" font-size="12">RSS / Atom / JSON Feeds</text>
  </g>

  <!-- Connection arrow 2 -> 3 -->
  <path d="M 612 235 L 666 235" stroke="#FF5A00" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="672,235 662,230 662,240" fill="#FF5A00" />

  <!-- Node 3: Edge Delivery -->
  <g transform="translate(680, 120)">
    <rect width="232" height="230" fill="#24211A" stroke="#3D392E" stroke-width="1.5" />
    <rect x="20" y="20" width="40" height="40" fill="#1B1913" stroke="#FF5A00" stroke-width="1.5" />
    <text x="40" y="46" text-anchor="middle" fill="#FF5A00" font-family="system-ui" font-size="20">🌐</text>
    <text x="74" y="38" fill="#F5F3EB" font-family="'Uncut Sans', system-ui" font-size="16" font-weight="600">Global Edge CDN</text>
    <text x="74" y="54" fill="#A9A69D" font-family="'JetBrains Mono', monospace" font-size="11">geetansh.tech</text>
    
    <line x1="20" y1="76" x2="212" y2="76" stroke="#302E27" stroke-width="1" />
    
    <rect x="20" y="90" width="192" height="34" fill="#1B1913" stroke="#302E27" />
    <text x="32" y="112" fill="#F5F3EB" font-family="'JetBrains Mono', monospace" font-size="12">Instant 100/100 CWV</text>
    
    <rect x="20" y="132" width="192" height="34" fill="#1B1913" stroke="#302E27" />
    <text x="32" y="154" fill="#F5F3EB" font-family="'JetBrains Mono', monospace" font-size="12">Zero Server Downtime</text>
    
    <rect x="20" y="174" width="192" height="34" fill="#1B1913" stroke="#302E27" />
    <text x="32" y="196" fill="#F5F3EB" font-family="'JetBrains Mono', monospace" font-size="12">Immutable Cache Headers</text>
  </g>
</svg>
